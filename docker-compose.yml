services:
  app:
    build: .
    image: sarsembayev-eldar-devops:latest
    container_name: sarsembayev-eldar-compose
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8081}:8080"
    environment:
      STUDENT_NAME: ${STUDENT_NAME:-Eldar}
      STUDENT_SURNAME: ${STUDENT_SURNAME:-Sarsembayev}
      STUDENT_GROUP: ${STUDENT_GROUP:-IT2-2301}
      STUDENT_ID: ${STUDENT_ID:-37006}
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
